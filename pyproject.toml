[project]
name = "llm-adr-index"
version = "0.1.0"
description = "adr-index: búsqueda en los ADRs del core con citas verificadas — ranking léxico determinista, respuesta LLM que no puede inventar citas (semana 20)."
requires-python = ">=3.12"
dependencies = [
    "llm-dev-core",
    "PyYAML>=6,<7",
]

[tool.uv.sources]
llm-dev-core = { path = "../llm-dev-core", editable = true }

[project.scripts]
adr-index = "adr_index.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/adr_index"]

[dependency-groups]
dev = ["pytest>=8,<9"]
